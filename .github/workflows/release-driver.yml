name: Release JDBC driver

# Tag jdbc-v<version>, matching jdbc-driver/build.gradle.kts: publishes
# com.querydesk:querydesk-jdbc to Maven Central and attaches the jar to a GitHub release.
on:
  push:
    tags: ["jdbc-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the JDK and Gradle pinned in mise.toml
      - uses: jdx/mise-action@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches the driver's version
        run: |
          version=$(./gradlew -q :jdbc-driver:properties --property version | awk '/^version:/ {print $2}')
          test "jdbc-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but version ${version}" >&2; exit 1; }
          # what the driver reports to a tool must agree
          major=$(grep -oE 'MAJOR_VERSION = [0-9]+' jdbc-driver/src/main/java/com/querydesk/jdbc/QueryDeskDriver.java | grep -oE '[0-9]+$')
          minor=$(grep -oE 'MINOR_VERSION = [0-9]+' jdbc-driver/src/main/java/com/querydesk/jdbc/QueryDeskDriver.java | grep -oE '[0-9]+$')
          [[ "${version}" == "${major}.${minor}."* ]] || { echo "QueryDeskDriver reports ${major}.${minor}, not ${version}" >&2; exit 1; }

      - name: Driver tests
        run: jdbc-driver/test.sh

      - name: Sign and publish to Maven Central
        run: ./gradlew :jdbc-driver:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          # a Central Portal user token, from central.sonatype.com → Account → Generate User Token
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # an ASCII-armored GPG private key, its public half on keys.openpgp.org
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: GitHub release
        run: |
          ./gradlew :jdbc-driver:jar
          gh release create "${GITHUB_REF_NAME}" jdbc-driver/build/libs/querydesk-jdbc-*.jar \
            --title "JDBC driver ${GITHUB_REF_NAME#jdbc-v}" --generate-notes $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}

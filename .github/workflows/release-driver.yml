name: Release JDBC driver

# Tag jdbc-v<major>.<minor>.<patch>, matching QueryDeskDriver's MAJOR_VERSION and MINOR_VERSION:
# attaches querydesk-jdbc-<version>.jar to a GitHub release. A suffix (jdbc-v0.2.0-beta) makes it
# a prerelease.
on:
  push:
    tags: ["jdbc-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the JDK pinned in mise.toml
      - uses: jdx/mise-action@v2

      - name: Tag matches the driver's version
        run: |
          version=${GITHUB_REF_NAME#jdbc-v}
          driver=jdbc-driver/src/main/java/com/querydesk/jdbc/QueryDeskDriver.java
          major=$(grep -oE 'MAJOR_VERSION = [0-9]+' $driver | grep -oE '[0-9]+$')
          minor=$(grep -oE 'MINOR_VERSION = [0-9]+' $driver | grep -oE '[0-9]+$')
          [[ "${version}" == "${major}.${minor}."* ]] || { echo "QueryDeskDriver reports ${major}.${minor}, not ${version}" >&2; exit 1; }
          echo "VERSION=${version}" >>"$GITHUB_ENV"

      # builds jdbc-driver/build/querydesk-jdbc.jar from scratch, then runs DriverTest against it
      - name: Build and test
        run: jdbc-driver/test.sh

      - name: GitHub release
        run: |
          cp jdbc-driver/build/querydesk-jdbc.jar "querydesk-jdbc-${VERSION}.jar"
          gh release create "${GITHUB_REF_NAME}" "querydesk-jdbc-${VERSION}.jar" \
            --title "JDBC driver ${VERSION}" --generate-notes $([[ "${VERSION}" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}

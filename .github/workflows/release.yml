name: Release

# Tag v<version>, matching build.gradle.kts: v0.2.0-beta publishes to the beta channel,
# v0.2.0 to the default one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches the plugin version
        run: |
          version=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but version ${version}" >&2; exit 1; }

      - name: Driver tests
        run: jdbc-driver/test.sh

      - name: Verify, sign and publish to the JetBrains Marketplace
        run: ./gradlew verifyPlugin publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" build/distributions/*-signed.zip --title "${GITHUB_REF_NAME}" --generate-notes $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
